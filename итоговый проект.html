<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List — менеджер задач</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe2ea;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --done: #16a34a;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #e0e7ff, transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: grid;
      gap: 16px;
      grid-template-columns: 290px minmax(0, 1fr) 220px;
      grid-template-areas:
        "header header header"
        "control list filters";
    }

    .app-header {
      grid-area: header;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 34px);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .panel,
    .list-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .control-panel {
      grid-area: control;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-panel {
      grid-area: list;
      min-height: 320px;
    }

    .filters {
      grid-area: filters;
      align-self: start;
    }

    .task-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"],
    input[type="search"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus,
    input[type="search"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      touch-action: manipulation;
    }

    .task-form button {
      padding: 12px 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      transition: background 0.15s, transform 0.08s;
    }

    .task-form button:hover {
      background: var(--primary-dark);
    }

    .task-form button:active {
      transform: translateY(1px);
    }

    .filter-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-btn {
      padding: 10px 12px;
      text-align: left;
      background: #f3f6fb;
      color: var(--text);
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .filter-btn:hover {
      background: #e8eefb;
    }

    .filter-btn.is-active {
      background: #e0e9ff;
      border-color: #b9ccff;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .stats {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    .task-item:hover {
      border-color: #c6d4e8;
    }

    .task-item.is-completed {
      background: #f8fafc;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      accent-color: var(--done);
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      cursor: pointer;
      user-select: none;
      line-height: 1.4;
    }

    .task-item.is-completed .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      flex: 0 0 auto;
      padding: 8px 10px;
      color: var(--danger);
      background: #fff1f1;
      border: 1px solid #ffd4d4;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }

    .delete-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    .empty-state {
      margin: 0;
      padding: 32px 8px;
      text-align: center;
      color: var(--muted);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "control"
          "filters"
          "list";
      }

      .filter-buttons {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .filter-btn {
        flex: 1 1 120px;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 16px 10px 28px;
      }

      .task-item {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .task-text {
        flex-basis: calc(100% - 32px);
      }

      .delete-btn {
        margin-left: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Менеджер задач</h1>
      <p class="subtitle">
        Добавляйте, отмечайте и фильтруйте задачи — данные сохраняются в браузере.
      </p>
    </header>

    <aside class="panel control-panel" aria-label="Панель управления">
      <form id="task-form" class="task-form" autocomplete="off">
        <label class="visually-hidden" for="task-input">Название новой задачи</label>
        <input
          id="task-input"
          type="text"
          placeholder="Что нужно сделать?"
          maxlength="200"
          required
        />
        <button type="submit">Добавить задачу</button>
      </form>

      <label class="visually-hidden" for="search-input">Поиск задач</label>
      <input
        id="search-input"
        type="search"
        placeholder="Поиск по названию..."
      />
    </aside>

    <main class="list-panel" aria-label="Список задач">
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>
        Задач пока нет. Добавьте первую!
      </p>
    </main>

    <aside class="panel filters" aria-label="Фильтрация задач">
      <h2 style="margin: 0 0 12px; font-size: 16px;">Фильтр</h2>
      <div id="filter-buttons" class="filter-buttons">
        <button type="button" class="filter-btn is-active" data-filter="all">
          Все
        </button>
        <button type="button" class="filter-btn" data-filter="active">
          Активные
        </button>
        <button type="button" class="filter-btn" data-filter="completed">
          Завершённые
        </button>
      </div>
      <p id="stats" class="stats"></p>
    </aside>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'selectel-todo-tasks-v1';

      const form = document.getElementById('task-form');
      const taskInput = document.getElementById('task-input');
      const searchInput = document.getElementById('search-input');
      const taskList = document.getElementById('task-list');
      const emptyState = document.getElementById('empty-state');
      const filterButtons = document.getElementById('filter-buttons');
      const stats = document.getElementById('stats');

      let tasks = loadTasks();
      let currentFilter = 'all';
      let searchQuery = '';

      function createId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];

          return parsed
            .filter((item) => item && typeof item.text === 'string')
            .map((item) => ({
              id: String(item.id || createId()),
              text: item.text.trim(),
              completed: Boolean(item.completed)
            }))
            .filter((item) => item.text.length > 0);
        } catch (error) {
          console.warn('Не удалось загрузить задачи из LocalStorage:', error);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.warn('Не удалось сохранить задачи в LocalStorage:', error);
        }
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function getVisibleTasks() {
        const query = searchQuery.trim().toLowerCase();

        return tasks.filter((task) => {
          const matchesFilter =
            currentFilter === 'all' ||
            (currentFilter === 'active' && !task.completed) ||
            (currentFilter === 'completed' && task.completed);

          const matchesSearch =
            !query || task.text.toLowerCase().includes(query);

          return matchesFilter && matchesSearch;
        });
      }

      function render() {
        const visibleTasks = getVisibleTasks();
        taskList.innerHTML = '';

        visibleTasks.forEach((task) => {
          const li = document.createElement('li');
          li.className = 'task-item' + (task.completed ? ' is-completed' : '');
          li.dataset.id = task.id;

          li.innerHTML = `
            <input
              class="task-checkbox"
              type="checkbox"
              data-action="toggle"
              ${task.completed ? 'checked' : ''}
              aria-label="Отметить задачу выполненной"
            />
            <span class="task-text" data-action="toggle" tabindex="0" role="button">
              ${escapeHtml(task.text)}
            </span>
            <button
              type="button"
              class="delete-btn"
              data-action="delete"
              aria-label="Удалить задачу"
            >Удалить</button>
          `;

          taskList.appendChild(li);
        });

        emptyState.hidden = visibleTasks.length > 0;
        emptyState.textContent =
          tasks.length === 0
            ? 'Задач пока нет. Добавьте первую!'
            : 'По вашему запросу ничего не найдено.';

        const activeCount = tasks.filter((task) => !task.completed).length;
        const completedCount = tasks.length - activeCount;

        stats.textContent =
          `Всего: ${tasks.length} · Активных: ${activeCount} · Завершённых: ${completedCount}`;

        filterButtons.querySelectorAll('.filter-btn').forEach((button) => {
          button.classList.toggle(
            'is-active',
            button.dataset.filter === currentFilter
          );
        });
      }

      function addTask(text) {
        tasks.unshift({
          id: createId(),
          text,
          completed: false
        });

        saveTasks();
        render();
      }

      function toggleTask(id) {
        const task = tasks.find((item) => item.id === id);
        if (!task) return;

        task.completed = !task.completed;
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter((item) => item.id !== id);
        saveTasks();
        render();
      }

      function handleTaskAction(event) {
        if (!(event.target instanceof Element)) return;

        const actionElement = event.target.closest('[data-action]');
        if (!actionElement || !taskList.contains(actionElement)) return;

        const item = actionElement.closest('.task-item');
        if (!item) return;

        const id = item.dataset.id;

        if (actionElement.dataset.action === 'toggle') {
          toggleTask(id);
        }

        if (actionElement.dataset.action === 'delete') {
          deleteTask(id);
        }
      }

      function handleFilterAction(event) {
        if (!(event.target instanceof Element)) return;

        const button = event.target.closest('[data-filter]');
        if (!button || !filterButtons.contains(button)) return;

        currentFilter = button.dataset.filter;
        render();
      }

      // Обработка touchstart/touchend + click.
      // На тач-устройствах touchend срабатывает без задержки,
      // а последующий click игнорируется, чтобы не было двойного срабатывания.
      function addTapListener(container, handler, selector) {
        let lastTouchTime = 0;

        container.addEventListener(
          'touchend',
          (event) => {
            if (!(event.target instanceof Element)) return;

            const target = event.target.closest(selector);
            if (!target || !container.contains(target)) return;

            event.preventDefault();
            lastTouchTime = Date.now();
            handler(event);
          },
          { passive: false }
        );

        container.addEventListener('click', (event) => {
          if (Date.now() - lastTouchTime < 500) return;
          if (!(event.target instanceof Element)) return;

          const target = event.target.closest(selector);
          if (!target || !container.contains(target)) return;

          handler(event);
        });
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const text = taskInput.value.trim();
        if (!text) return;

        addTask(text);
        taskInput.value = '';
        taskInput.focus();
      });

      searchInput.addEventListener('input', (event) => {
        searchQuery = event.target.value;
        render();
      });

      taskList.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        if (!event.target.classList.contains('task-text')) return;

        event.preventDefault();

        const item = event.target.closest('.task-item');
        if (item) toggleTask(item.dataset.id);
      });

      addTapListener(taskList, handleTaskAction, '[data-action]');
      addTapListener(filterButtons, handleFilterAction, '[data-filter]');

      render();
    })();
  </script>
</body>
</html>
